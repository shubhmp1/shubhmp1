<svg xmlns="http://www.w3.org/2000/svg" width="320" height="90" viewBox="0 0 320 90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .wrap { animation: bounce 1.6s ease-in-out infinite; transform-origin: 160px 45px; }
    .glow { animation: pulse 1.6s ease-in-out infinite; transform-origin: 160px 45px; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: 0; transform: scale(1.08); } }
  </style>
  <g class="wrap">
    <rect class="glow" x="10" y="15" width="300" height="60" rx="30" fill="#0A66C2"/>
    <rect x="10" y="15" width="300" height="60" rx="30" fill="#0A66C2"/>
    <rect x="28" y="29" width="32" height="32" rx="6" fill="#ffffff"/>
    <text x="44" y="54" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0A66C2" text-anchor="middle">in</text>
    <text x="74" y="51" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Connect on LinkedIn</text>
  </g>
</svg>
